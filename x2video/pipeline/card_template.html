<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Tweet Card</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #111;
      color: #e7e9ea;
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    }
    body { position: relative; }
    .bg {
      position: absolute;
      inset: -80px;
      background-size: cover;
      background-position: center;
      filter: blur(42px) saturate(1.25) brightness(0.55);
      transform: scale(1.12);
    }
    .veil {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(8,8,10,0.35) 0%,
        rgba(8,8,10,0.28) 42%,
        rgba(8,8,10,0.78) 100%
      );
    }
    .layout {
      position: relative;
      z-index: 1;
      height: 1920px;
      padding: 110px 48px 300px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 28px;
    }
    .kicker {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
    }
    .series {
      font-size: 22px;
      color: rgba(240,236,227,0.7);
      letter-spacing: 0.18em;
      margin-bottom: 6px;
    }
    .index {
      font-size: 64px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #fff;
      text-shadow: 0 2px 18px rgba(0,0,0,0.45);
    }
    .date {
      font-size: 36px;
      font-weight: 700;
      color: #f0ece3;
      letter-spacing: 0.04em;
    }
    .card {
      width: 100%;
      background: rgba(22,24,28,0.92);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      padding: 28px 28px 24px;
    }
    .card.short .body { font-size: 36px; }
    .card.short .media, .card.short .media img { max-height: 420px; }
    .row { display: flex; gap: 16px; align-items: flex-start; }
    .avatar, .avatar-img, .avatar-fallback {
      width: 72px; height: 72px; border-radius: 50%;
      flex-shrink: 0; object-fit: cover;
    }
    .avatar-fallback {
      display: flex; align-items: center; justify-content: center;
      background: #2f3336; font-size: 28px; font-weight: 700;
    }
    .name-line {
      display: flex; align-items: center; gap: 8px;
      font-size: 28px; font-weight: 700;
    }
    .verified {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; border-radius: 50%;
      background: #e7e9ea; color: #000; font-size: 13px;
    }
    .handle { margin-top: 4px; color: #8b98a5; font-size: 22px; }
    .body {
      margin: 18px 0 6px;
      font-size: 30px;
      line-height: 1.4;
      word-break: break-word;
    }
    .media {
      margin: 14px 0 4px;
      border-radius: 16px;
      overflow: hidden;
      max-height: 280px;
    }
    .media img {
      display: block; width: 100%; max-height: 280px; object-fit: cover;
    }
    .stats {
      display: flex; gap: 22px; margin-top: 16px;
      color: #8b98a5; font-size: 20px;
    }
    .stats b { color: #e7e9ea; }
    .punch {
      font-size: 58px;
      font-weight: 800;
      line-height: 1.25;
      color: #fff;
      -webkit-text-stroke: 8px #111;
      paint-order: stroke fill;
      text-shadow: 0 2px 0 #111;
    }
    .punch-src {
      font-size: 20px;
      color: rgba(255,255,255,0.55);
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="bg" style="{{BG_STYLE}}"></div>
  <div class="veil"></div>
  <div class="layout">
    <div class="kicker">
      <div>
        <div class="series">今日外网</div>
        <div class="index">{{INDEX}}</div>
      </div>
      <div class="date">{{DATE}}</div>
    </div>
    <article class="card {{SHORT_CLASS}}">
      <div class="row">
        <div class="avatar">{{AVATAR}}</div>
        <div>
          <div class="name-line">{{AUTHOR_NAME}} {{VERIFIED}}</div>
          <div class="handle">@{{HANDLE}}</div>
        </div>
      </div>
      <div class="body">{{BODY}}</div>
      {{MEDIA}}
      <div class="stats">
        <span><b>{{LIKES}}</b> likes</span>
        <span><b>{{RETWEETS}}</b> RT</span>
        <span><b>{{VIEWS}}</b> views</span>
      </div>
    </article>
    <div>
      <div class="punch-src">{{CAPTION}}</div>
      <div class="punch">{{TRANSLATION}}</div>
    </div>
  </div>
</body>
</html>
